# ==============================================================================
# TeamVault Nginx 反向代理配置模板
# 适用场景：Linux 服务器标准 80 / 443 端口代理、大文件上传支持、SSL 加密
# ==============================================================================

# 1. HTTP 访问（自动重定向到 HTTPS 或直接提供服务）
server {
    listen 80;
    server_name vault.yourdomain.com; # 替换为您实际的域名或服务器 IP

    # 如果需要强制 HTTPS，请取消下一行的注释：
    # return 301 https://$host$request_uri;

    # 允许上传大型资料文件（如视频、压缩包、大型文档），默认为 500MB
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;

        # WebSocket 与持久连接支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 真实客户端信息转发（用于审计日志记录真实 IP）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时时间设置（避免大文件上传/下载时超时断开）
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

